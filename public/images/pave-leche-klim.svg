<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración del pavé de leche Klim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6ee"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <linearGradient id="cremaSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf9"/>
      <stop offset="1" stop-color="#fbe4e9"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="14" result="offset"/>
      <feFlood flood-color="#c08aa4" flood-opacity="0.28" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <circle cx="140" cy="90" r="110" fill="#ffd3e2" opacity="0.55"/>
  <circle cx="680" cy="120" r="90" fill="#cddfff" opacity="0.5"/>
  <circle cx="720" cy="480" r="70" fill="#ffe9b8" opacity="0.4"/>

  <!-- Humo / vapor -->
  <g stroke="#f2c9d6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M330 190 C320 170 345 162 335 142 C325 122 352 110 342 88"/>
    <path d="M470 195 C460 175 485 167 475 147 C465 127 492 115 482 93"/>
  </g>

  <!-- Plato -->
  <ellipse cx="400" cy="510" rx="330" ry="48" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="400" cy="508" rx="250" ry="36" fill="#ffffff" stroke="#f3e3e9" stroke-width="3"/>
  <ellipse cx="400" cy="508" rx="150" ry="24" fill="#fff7f9"/>

  <g filter="url(#drop)">
    <!-- Capa 1: Crema (base) -->
    <rect x="270" y="455" width="260" height="34" rx="12" fill="url(#cremaSide)" stroke="#f0cdd6" stroke-width="2"/>
    <!-- Capa 2: Klim -->
    <rect x="276" y="449" width="248" height="6" rx="3" fill="#fbe9d1"/>
    <!-- Capa 3: Ducal -->
    <rect x="274" y="423" width="252" height="26" rx="8" fill="#ecc99e" stroke="#d6ab7f" stroke-width="2"/>
    <!-- Capa 4: Crema -->
    <rect x="270" y="391" width="260" height="34" rx="12" fill="url(#cremaSide)" stroke="#f0cdd6" stroke-width="2"/>
    <!-- Capa 5: Klim -->
    <rect x="276" y="385" width="248" height="6" rx="3" fill="#fbe9d1"/>
    <!-- Capa 6 y 7: Ducal + Ducal -->
    <rect x="274" y="359" width="252" height="26" rx="8" fill="#ecc99e" stroke="#d6ab7f" stroke-width="2"/>
    <rect x="274" y="333" width="252" height="26" rx="8" fill="#ecc99e" stroke="#d6ab7f" stroke-width="2"/>
    <!-- Capa 8: Crema -->
    <rect x="270" y="301" width="260" height="34" rx="12" fill="url(#cremaSide)" stroke="#f0cdd6" stroke-width="2"/>
    <!-- Capa 9: Klim -->
    <rect x="276" y="295" width="248" height="6" rx="3" fill="#fbe9d1"/>
    <!-- Capa 10: Ducal -->
    <rect x="274" y="269" width="252" height="26" rx="8" fill="#ecc99e" stroke="#d6ab7f" stroke-width="2"/>
    <!-- Capa 11: Crema con borde superior ondulado -->
    <path d="M270 269 L270 250 C300 231 338 232 358 242 C374 250 406 246 428 235 C453 223 498 232 530 244 L530 269 Z"
          fill="url(#cremaSide)" stroke="#f0cdd6" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Especias de Klim espolvoreadas -->
  <g fill="#fff" opacity="0.9">
    <circle cx="330" cy="228" r="3"/>
    <circle cx="385" cy="221" r="2.4"/>
    <circle cx="445" cy="227" r="2.8"/>
    <circle cx="300" cy="238" r="2"/>
    <circle cx="500" cy="236" r="2.4"/>
    <circle cx="360" cy="233" r="2"/>
    <circle cx="420" cy="235" r="2.2"/>
  </g>

  <!-- Puntos en las Ducales -->
  <g fill="#c89a6c" opacity="0.5">
    <circle cx="320" cy="436" r="2.6"/>
    <circle cx="375" cy="432" r="2.2"/>
    <circle cx="440" cy="437" r="2.8"/>
    <circle cx="495" cy="433" r="2.2"/>
    <circle cx="340" cy="371" r="2.4"/>
    <circle cx="405" cy="368" r="2.8"/>
    <circle cx="470" cy="372" r="2.2"/>
    <circle cx="350" cy="282" r="2.6"/>
    <circle cx="420" cy="279" r="2.2"/>
    <circle cx="485" cy="283" r="2.6"/>
  </g>

  <!-- Texto -->
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" letter-spacing="5" fill="#b76a8a">PAVÉ DE LECHE KLIM</text>
  <text x="400" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#c98aa6">CREMA · GALLETAS · ESPOLVOREADO</text>
</svg>